spring.application.name=conference
server.port=${PORT:8080}

# ===============================
# DB
# ===============================
# By default the app uses an in-memory H2 database that is created from schema.sql
# and filled with demo data from data-h2.sql on every start.
# Run with the "postgres" profile (see application-postgres.properties) for a persistent database.
spring.datasource.url=jdbc:h2:mem:conference;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.platform=h2

# ===============================
# Session cookie
# ===============================
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
