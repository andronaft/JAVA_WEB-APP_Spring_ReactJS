# PostgreSQL profile: SPRING_PROFILES_ACTIVE=postgres
# Connection settings come from the environment, never commit real credentials.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/conference}
spring.datasource.username=${DB_USERNAME:conference}
spring.datasource.password=${DB_PASSWORD:}

# Create the tables if they don't exist yet (schema.sql is idempotent).
# No demo data is loaded, see README for creating the first admin.
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
